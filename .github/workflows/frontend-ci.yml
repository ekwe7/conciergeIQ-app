name: Frontend CI

on:
  push:
    branches:
      - main
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'prettier.config.js'
  pull_request:
    branches:
      - main
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - '.github/workflows/frontend-ci.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.js'
      - 'prettier.config.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Run linter
        run: pnpm -r --if-present lint

      - name: Run typecheck
        run: pnpm -r --if-present typecheck

  unit-and-component-tests:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Run tests
        run: pnpm -r --if-present test --run

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-component-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --prefer-frozen-lockfile

      - name: Build packages & applications
        run: pnpm -r --if-present build

      - name: Verify build artifacts
        run: |
          echo "Verifying build outputs..."
          # Guest Web App check
          if [ -d "apps/guest-web/dist" ]; then
            echo "✓ apps/guest-web/dist exists"
          fi
          # Dashboard Web App check
          if [ -d "apps/dashboard-web/dist" ]; then
            echo "✓ apps/dashboard-web/dist exists"
          fi

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Run pnpm audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
